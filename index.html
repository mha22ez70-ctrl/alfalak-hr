<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════ هوية الفلك ═══════ */
:root{
  --ink:#1B1D21; --ink2:#6E6A62; --ink3:#9A948A;
  --paper:#F8F6F1; --card:#FFFFFF; --sunk:#F2EFE8; --line:#E6E1D7;
  --gold:#A8812F; --gold2:#C9A04B; --goldsoft:#F5EDDC;
  --ok:#1F7A4D; --oksoft:#E4F0E9;
  --warn:#8A5A16; --warnsoft:#FBF0D9;
  --bad:#A93226; --badsoft:#F9E5E2;
  --shadow:0 1px 2px rgb(27 29 33/.04), 0 8px 24px -12px rgb(27 29 33/.14);
  --fd:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;
  --fb:'IBM Plex Sans Arabic','Readex Pro',system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#ECE8DF; --ink2:#A39D92; --ink3:#7C766C;
  --paper:#141517; --card:#1E2023; --sunk:#25272B; --line:#33353A;
  --gold:#D2A94F; --gold2:#E0BC6E; --goldsoft:#332B1B;
  --ok:#6BC494; --oksoft:#172E23;
  --warn:#DDB45A; --warnsoft:#33291A;
  --bad:#E08878; --badsoft:#39241F;
  --shadow:0 1px 2px rgb(0 0 0/.3), 0 8px 24px -12px rgb(0 0 0/.6);
}}
:root[data-theme="dark"]{
  --ink:#ECE8DF; --ink2:#A39D92; --ink3:#7C766C;
  --paper:#141517; --card:#1E2023; --sunk:#25272B; --line:#33353A;
  --gold:#D2A94F; --gold2:#E0BC6E; --goldsoft:#332B1B;
  --ok:#6BC494; --oksoft:#172E23;
  --warn:#DDB45A; --warnsoft:#33291A;
  --bad:#E08878; --badsoft:#39241F;
  --shadow:0 1px 2px rgb(0 0 0/.3), 0 8px 24px -12px rgb(0 0 0/.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--fb);font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--fd);font-weight:600;margin:0;text-wrap:balance}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.2px}
.muted{color:var(--ink2)}

/* ═══════ شريط التحميل ═══════ */
#busy{position:fixed;inset-inline:0;top:0;height:2px;background:var(--gold2);
  transform:scaleX(0);transform-origin:100% 50%;transition:transform .3s;z-index:60}
#busy.on{transform:scaleX(1)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;
  transform:translate(-50%,16px);background:var(--ink);color:var(--paper);
  padding:11px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;
  z-index:70;max-width:min(92vw,460px);text-align:center;font-size:14px;box-shadow:var(--shadow)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ═══════ بوابة الدخول ═══════ */
.gate{min-height:100dvh;display:grid;place-items:center;padding:24px 18px;
  background:
    radial-gradient(90rem 40rem at 70% -10%, rgb(201 160 75/.16), transparent 60%),
    linear-gradient(165deg,#16181B,#0E0F11)}
.gbox{width:min(440px,100%);background:var(--card);border-radius:22px;
  padding:34px 30px;box-shadow:0 30px 80px -30px rgb(0 0 0/.6)}
.gmark{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:22px}
.gmark img{width:66px;height:66px;object-fit:contain}
.gmark .wordmark{font-family:var(--fd);font-size:13px;font-weight:600;
  letter-spacing:.34em;color:var(--gold);text-transform:uppercase}
.gbox h2{font-size:23px;text-align:center}
.gbox .lead{margin:6px 0 24px;color:var(--ink2);font-size:14px;text-align:center}
.gbox label{display:grid;gap:7px;font-size:13px;color:var(--ink2);margin-bottom:16px}
.gbox input{background:var(--sunk);border:1px solid var(--line);border-radius:11px;
  padding:13px 14px;width:100%}
.gbox input:focus{border-color:var(--gold);outline:none}
.gate .btn-main{width:100%;padding:14px;font-size:16px;font-weight:600;border:0;border-radius:12px;
  background:linear-gradient(135deg,var(--gold2),var(--gold));color:#17181A;
  font-family:var(--fd);box-shadow:0 8px 20px -10px rgb(168 129 47/.9)}
.gate .btn-main:disabled{opacity:.6}
.gfoot{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:18px}
.lnk{background:none;border:0;color:var(--gold);font-weight:600;font-size:13.5px;padding:4px}
.lnk.danger{color:var(--bad)}
.ver{text-align:center;font-size:11.5px;color:var(--ink3);margin:16px 0 0;letter-spacing:.06em}
.err{background:var(--badsoft);color:var(--bad);border-radius:11px;padding:11px 14px;
  font-size:13.5px;margin-bottom:16px;line-height:1.6}
.err.good{background:var(--oksoft);color:var(--ok)}
.steps{margin:0 0 20px;padding-inline-start:18px;font-size:13px;color:var(--ink2);line-height:2}
.steps code{background:var(--sunk);border-radius:5px;padding:1px 6px;font-size:12px;
  direction:ltr;display:inline-block;unicode-bidi:isolate}

/* ═══════ الهيكل ═══════ */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  background:var(--ink);color:#F2EEE5;
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
  border-bottom:1px solid rgb(255 255 255/.07)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 auto;
  text-decoration:none;color:inherit;background:none;border:0;padding:4px}
.brand>span{display:block;min-width:0;overflow:hidden}
.brand img{width:34px;height:34px;object-fit:contain;background:#fff;border-radius:9px;padding:3px;flex:none}
.brand b{display:block;font-family:var(--fd);font-size:14.5px;font-weight:600;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.brand i{display:block;font-style:normal;font-size:11px;color:#B9B2A4;letter-spacing:.04em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1}
.ibtn{width:38px;height:38px;border-radius:11px;border:1px solid rgb(255 255 255/.14);
  background:rgb(255 255 255/.06);color:#F2EEE5;display:grid;place-items:center;flex:none}
.ibtn:hover{background:rgb(255 255 255/.13)}
.langbtn{height:38px;padding:0 13px;border-radius:11px;border:1px solid rgb(201 160 75/.5);
  background:rgb(201 160 75/.14);color:#E7C67E;font-family:var(--fd);font-weight:600;font-size:12.5px;
  letter-spacing:.08em;flex:none}
.who{display:flex;align-items:center;gap:9px;padding-inline-start:4px;min-width:0}
.who .av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--gold2),var(--gold));color:#17181A;
  font-weight:700;font-size:12.5px;font-family:var(--fd)}
.who div{min-width:0}
.who b{display:block;font-size:13.5px;font-weight:600;line-height:1.2;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:22vw}
.who i{display:block;font-style:normal;font-size:11px;color:#B9B2A4}

.shell{display:flex;align-items:flex-start;min-height:calc(100dvh - 60px)}
.side{position:fixed;inset-block:0;inset-inline-start:0;z-index:45;width:268px;flex:none;
  background:var(--card);border-inline-end:1px solid var(--line);
  padding:18px 14px calc(18px + env(safe-area-inset-bottom,0px));
  overflow-y:auto;transform:translateX(100%);transition:transform .22s ease}
[dir=ltr] .side{transform:translateX(-100%)}
.side.open{transform:none}
.scrim{position:fixed;inset:0;background:rgb(10 11 13/.5);z-index:40;opacity:0;
  pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.navsec{font-size:10.5px;font-weight:700;letter-spacing:.16em;color:var(--ink3);
  margin:18px 12px 7px;text-transform:uppercase}
.navsec:first-child{margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:start;
  padding:11px 12px;border:0;border-radius:11px;background:none;color:var(--ink);
  font-size:14px;font-weight:500}
.nav button:hover{background:var(--sunk)}
.nav button.on{background:var(--goldsoft);color:var(--gold);font-weight:600}
.nav svg{flex:none;opacity:.85}
.nav .badge{margin-inline-start:auto;min-width:21px;height:21px;padding:0 6px;border-radius:99px;
  background:var(--bad);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center}
main{flex:1;min-width:0;padding:20px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1120px;margin:0 auto}
@media (min-width:980px){
  .side,[dir=ltr] .side{position:sticky;top:60px;height:calc(100dvh - 60px);transform:none;z-index:1}
  .scrim{display:none}
  #menuBtn{display:none}
  main{padding:26px 28px 60px}
}

/* ═══════ عناصر مشتركة ═══════ */
.pagehead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.pagehead h1{font-size:25px;font-weight:600;letter-spacing:-.01em}
.pagehead p{margin:3px 0 0;color:var(--ink2);font-size:13.5px}
.pagehead .acts{margin-inline-start:auto;display:flex;gap:9px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 16px;border-radius:11px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#F5F2EA}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));border:0;color:#17181A}
.btn.sm{padding:6px 13px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px}
.kpi .lab{font-size:12.5px;color:var(--ink2);letter-spacing:.01em}
.kpi .num{font-family:var(--fd);font-size:29px;font-weight:600;line-height:1.15;margin-top:5px;
  font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--ink3);margin-top:3px}
.kpi.alert .num{color:var(--bad)}
.kpi.warn .num{color:var(--warn)}

.hero{position:relative;overflow:hidden;border-radius:20px;padding:26px 28px;margin-bottom:22px;
  background:linear-gradient(135deg,#232629,#16181A);color:#F2EEE5}
.hero::after{content:"";position:absolute;inset-inline-end:-80px;top:-110px;width:320px;height:320px;
  border-radius:50%;background:radial-gradient(circle,rgb(201 160 75/.20),transparent 68%);pointer-events:none}
.hero .eyebrow{font-family:var(--fd);font-size:11.5px;font-weight:600;letter-spacing:.22em;
  color:var(--gold2);text-transform:uppercase}
.hero h1{font-size:clamp(23px,4.6vw,31px);font-weight:600;margin:8px 0 4px}
.hero p{margin:0;color:#B9B2A4;font-size:14.5px}
.hero .rule{width:52px;height:2px;background:var(--gold2);border-radius:2px;margin-top:16px}

.sechead{display:flex;align-items:baseline;gap:12px;margin:26px 0 13px}
.sechead h2{font-size:17px}
.sechead .more{margin-inline-start:auto}

.row{display:flex;align-items:center;gap:13px}
.av{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:var(--goldsoft);color:var(--gold);font-weight:700;font-size:13.5px;font-family:var(--fd)}
.av.ic{background:var(--sunk);color:var(--ink2)}
.ttl{font-size:15px;font-weight:600;line-height:1.35}
.sub{font-size:12.5px;color:var(--ink2);margin-top:2px}
.tag{display:inline-flex;align-items:center;padding:3px 11px;border-radius:99px;
  font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--ink2)}
.tag.ok{background:var(--oksoft);color:var(--ok)}
.tag.warn{background:var(--warnsoft);color:var(--warn)}
.tag.bad{background:var(--badsoft);color:var(--bad)}
.tag.gold{background:var(--goldsoft);color:var(--gold)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13.5px;margin:14px 0 0}
.kv dt{color:var(--ink2)}
.kv dd{margin:0;text-align:end}
.foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;
  border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.empty{grid-column:1/-1;text-align:center;color:var(--ink2);padding:46px 20px;
  background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}
.note{margin:12px 0 0;padding:10px 13px;border-radius:10px;font-size:13px;
  background:var(--sunk);color:var(--ink2)}
.note.bad{background:var(--badsoft);color:var(--bad)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.field{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:0 13px;height:42px;flex:1 1 210px;min-width:0}
.field input,.field select{border:0;background:none;outline:none;width:100%;font-size:14px}
.chip{height:36px;padding:0 15px;border-radius:99px;border:1px solid var(--line);
  background:var(--card);color:var(--ink2);font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#F5F2EA;font-weight:600}
.meter{height:7px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;background:var(--gold);border-radius:99px}
.meter.bad i{background:var(--bad)}
.meter.warn i{background:var(--warn)}
.net{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:14px}
.net span{color:var(--ink2);font-size:13.5px}
.net strong{font-family:var(--fd);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.xl{list-style:none;margin:14px 0 0;padding:0;font-size:13.5px}
.xl li{display:flex;gap:9px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.xl li>div{flex:1;min-width:0}
.xl small{display:block;color:var(--ink2);font-size:12px}
.xl span.amt{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.plate{align-self:flex-start;border:1.6px solid var(--ink);border-radius:7px;padding:3px 13px;
  font-weight:700;letter-spacing:.6px;font-family:var(--fd);font-size:14px}

.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;min-width:620px}
th{text-align:start;font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--ink2);
  padding:13px 16px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase}
td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px}
td small{display:block;color:var(--ink2);font-size:12px}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:1.6px solid var(--line);background:var(--sunk)}
.bars{display:grid;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:20px}
.brow{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:13px;align-items:center;font-size:13.5px}
.brow i{height:11px;border-radius:99px;background:var(--gold);display:block;min-width:3px}
.brow b{font-weight:600}
.brow span{font-variant-numeric:tabular-nums;color:var(--ink2)}

.runway{position:relative;height:96px;margin:24px 12px 6px}
.track{position:absolute;inset-inline:0;top:36px;height:7px;border-radius:99px;
  background:linear-gradient(to var(--gdir,left),var(--warnsoft) 0 50%,var(--oksoft) 50% 100%)}
.tick{position:absolute;top:58px;font-size:11.5px;color:var(--ink3);transform:translateX(50%);white-space:nowrap}
.dot{position:absolute;width:19px;height:19px;border-radius:50%;border:3px solid var(--card);
  padding:0;transform:translateX(50%)}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.ok{background:var(--ok)}
.docs{list-style:none;margin:14px 0 0;padding:0}
.docs li{display:grid;grid-template-columns:4px 1fr auto;gap:13px;align-items:center;
  padding:11px 0;border-top:1px solid var(--line)}
.docs li i{align-self:stretch;border-radius:3px}
.docs li i.bad{background:var(--bad)}.docs li i.warn{background:var(--warn)}.docs li i.ok{background:var(--ok)}
.docs button{background:none;border:0;text-align:start;color:inherit;padding:0;font-size:14px}

dialog{border:0;border-radius:18px;padding:0;width:min(600px,94vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgb(12 13 15/.55)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;
  border-bottom:1px solid var(--line)}
.dh h3{font-size:17px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;padding:20px 22px}
.fields label{display:grid;gap:6px;font-size:12.5px;color:var(--ink2)}
.fields label.wide,.fields .wide{grid-column:1/-1}
.fields input,.fields select{background:var(--sunk);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px}
.fields input:focus,.fields select:focus{border-color:var(--gold);outline:none}
.df{display:flex;gap:10px;padding:16px 22px;border-top:1px solid var(--line)}
.sheet{display:grid;gap:11px}
.srow{padding:14px 16px;border:1px solid var(--line);border-radius:15px;background:var(--card)}
.srow .shd{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.srow .shd b{display:block;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.srow .shd small{display:block;color:var(--ink3);font-size:12px;font-weight:400}
.srow .cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px}
.srow .cell{display:grid;gap:6px}
.srow .cell>span{font-size:12px;color:var(--ink2)}
.srow .cnow{font-style:normal;color:var(--gold)}
.srow .pair{display:flex;gap:7px}
.srow input,.srow select{background:var(--sunk);border:1px solid var(--line);
  border-radius:10px;padding:9px 11px;font:inherit;color:inherit;min-width:0}
.srow .pair input{flex:1 1 90px}
.srow .pair select{flex:0 0 96px}
.srow input:focus,.srow select:focus{border-color:var(--gold);outline:none}
.srow.has{border-color:var(--gold2)}
.sbar{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  margin-top:14px;padding:13px 16px;border:1px solid var(--line);border-radius:15px;
  background:var(--card);box-shadow:0 -6px 18px rgb(0 0 0/.06)}
.sbar .grow{margin-inline-start:auto}
#openBanner{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;
  background:var(--warnsoft);color:var(--warn);padding:10px 16px;font-size:13px;
  font-weight:600;text-align:center}
@media (max-width:560px){
  .fields{grid-template-columns:1fr}
  .who .user-txt{display:none}
  .brand i{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="busy"></div>
<div id="gate" class="gate"></div>

<div id="app" hidden>
<div id="openBanner" hidden></div>

<header class="topbar">
  <button class="ibtn" id="menuBtn" aria-label="Menu">

function normUrl(raw){
 let u=String(raw||'').trim();
 if(!u)return'';
 if(!/^https?:\/\//i.test(u))u='https://'+u;
 let x;try{x=new URL(u)}catch(e){return u.replace(/\/+$/,'')}
 const m=x.pathname.match(/\/project\/([a-z0-9]{12,})/i);
 if(/(^|\.)supabase\.(com|io)$/i.test(x.hostname)&&m)return'https://'+m[1]+'.supabase.co';
 return x.origin}
const base=()=>normUrl(CFG.url);
function headers(extra){return Object.assign({apikey:CFG.key,Authorization:'Bearer '+(SESSION?SESSION.access_token:CFG.key)},extra||{})}

async function refreshToken(){
 if(!SESSION||!SESSION.refresh_token)return false;
 const r=await fetch(base()+'/auth/v1/token?grant_type=refresh_token',{method:'POST',
  headers:{apikey:CFG.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:SESSION.refresh_token})});
 if(!r.ok){saveSession(null);return false}
 saveSession(await r.json());return true}

async function rest(path,opt,retry){
 const r=await fetch(base()+'/rest/v1/'+path,Object.assign({},opt,{headers:headers(Object.assign({'Content-Type':'application/json'},(opt||{}).headers))}));
 if(r.status===401&&!retry){if(await refreshToken())return rest(path,opt,true);throw new Error(t('sessionEnded'))}
 if(!r.ok){let m='';try{const j=await r.json();m=j.message||j.hint||j.error_description||''}catch(e){}
  if(/row-level security/i.test(m))m=t('rlsDenied');
  throw new Error(m||(t('connErr')+' ('+r.status+')'))}
 if(r.status===204)return null;
 const x=await r.text();return x?JSON.parse(x):null}

const api={
 sel:(tb,q)=>rest(tb+'?select=*'+(q||'')),
 ins:(tb,row)=>rest(tb,{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(row)}),
 upd:(tb,id,patch)=>rest(tb+'?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(patch)}),
 del:(tb,id)=>rest(tb+'?id=eq.'+id,{method:'DELETE'}),
 rpc:(fn,args)=>rest('rpc/'+fn,{method:'POST',body:JSON.stringify(args||{})})};

async function uploadReceipt(file){
 const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
 const path=TODAY+'/'+Math.random().toString(36).slice(2,10)+'.'+ext;
 const r=await fetch(base()+'/storage/v1/object/receipts/'+path,{method:'POST',
  headers:headers({'Content-Type':file.type||'application/octet-stream','x-upsert':'true'}),body:file});
 if(!r.ok)throw new Error(t('uploadFailed'));
 return path}

async function receiptLink(path){
 const r=await fetch(base()+'/storage/v1/object/sign/receipts/'+path,{method:'POST',
  headers:headers({'Content-Type':'application/json'}),body:JSON.stringify({expiresIn:3600})});
 if(!r.ok)throw new Error(t('receiptFailed'));
 const j=await r.json();return base()+'/storage/v1'+j.signedURL}

/* توحيد النص للمطابقة: يتجاهل التشكيل والمسافات وصور الألف والياء */
const nrm=s=>String(s||'').trim().toLowerCase()
 .replace(/[\u064B-\u0652\u0640]/g,'')
 .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
 .replace(/[\s_\-\/\\().:،,]+/g,'');

const colIdx=s=>{let n=0;for(const ch of s.toUpperCase())n=n*26+(ch.charCodeAt(0)-64);return n-1};

function parseCSV(text){
 text=text.replace(/^﻿/,'');
 const head=(text.split(/\r?\n/)[0]||'');
 const delim=head.split(';').length>head.split(',').length?';':',';
 const rows=[];let row=[],cell='',q=false;
 for(let i=0;i<text.length;i++){const ch=text[i];
  if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
  else if(ch==='"')q=true;
  else if(ch===delim){row.push(cell);cell=''}
  else if(ch==='\n'){row.push(cell);cell='';rows.push(row);row=[]}
  else if(ch!=='\r')cell+=ch}
 if(cell.length||row.length){row.push(cell);rows.push(row)}
 return rows.filter(r=>r.some(c=>String(c).trim()!==''))}

async function inflateRaw(buf,method){
 if(method===0)return new Uint8Array(buf);
 if(typeof DecompressionStream==='undefined')throw new Error(t('impNeedCsv'));
 const st=new Blob([buf]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
 return new Uint8Array(await new Response(st).arrayBuffer())}

async function unzip(ab){
 const dv=new DataView(ab),u8=new Uint8Array(ab);
 let eocd=-1;
 for(let i=ab.byteLength-22;i>=0&&i>ab.byteLength-66000;i--){
  if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}}
 if(eocd<0)throw new Error(t('impBadFile'));
 const n=dv.getUint16(eocd+10,true),cd=dv.getUint32(eocd+16,true);
 const out={};let p=cd;
 for(let k=0;k<n;k++){
  if(dv.getUint32(p,true)!==0x02014b50)break;
  const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true);
  const nlen=dv.getUint16(p+28,true),elen=dv.getUint16(p+30,true),clen=dv.getUint16(p+32,true);
  const lho=dv.getUint32(p+42,true);
  const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nlen));
  const lnlen=dv.getUint16(lho+26,true),lelen=dv.getUint16(lho+28,true);
  const start=lho+30+lnlen+lelen;
  out[name]={method,data:ab.slice(start,start+csize)};
  p+=46+nlen+elen+clen}
 return out}

async function parseXLSX(ab){
 const z=await unzip(ab),dec=new TextDecoder(),P=new DOMParser();
 const get=async n=>z[n]?dec.decode(await inflateRaw(z[n].data,z[n].method)):'';
 let sheetPath='xl/worksheets/sheet1.xml';
 try{
  const wb=await get('xl/workbook.xml'),rels=await get('xl/_rels/workbook.xml.rels');
  if(wb&&rels){
   const wd=P.parseFromString(wb,'application/xml'),rd=P.parseFromString(rels,'application/xml');
   const sh=wd.getElementsByTagName('sheet')[0];
   const rid=sh&&(sh.getAttribute('r:id')||sh.getAttribute('id'));
   if(rid){const rel=[...rd.getElementsByTagName('Relationship')].find(r=>r.getAttribute('Id')===rid);
    if(rel){let tg=rel.getAttribute('Target')||'';tg=tg.replace(/^\//,'');
     sheetPath=tg.startsWith('xl/')?tg:'xl/'+tg}}}
 }catch(e){}
 const shared=[];
 const ss=await get('xl/sharedStrings.xml');
 if(ss){const d=P.parseFromString(ss,'application/xml');
  [...d.getElementsByTagName('si')].forEach(si=>
   shared.push([...si.getElementsByTagName('t')].map(x=>x.textContent).join('')))}
 const sx=await get(sheetPath);
 if(!sx)throw new Error(t('impBadFile'));
 const d=P.parseFromString(sx,'application/xml'),rows=[];
 [...d.getElementsByTagName('row')].forEach(r=>{
  const arr=[];
  [...r.getElementsByTagName('c')].forEach(c=>{
   const ref=(c.getAttribute('r')||'').replace(/[0-9]/g,'');
   const col=ref?colIdx(ref):arr.length;
   const ty=c.getAttribute('t');let v='';
   if(ty==='inlineStr')v=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');
   else{const el=c.getElementsByTagName('v')[0];v=el?el.textContent:'';
    if(ty==='s')v=shared[+v]||''}
   arr[col]=v});
  rows.push(arr)});
 return rows.filter(r=>r&&r.some(c=>String(c||'').trim()!==''))}

async function readSheet(file){
 const n=file.name.toLowerCase();
 if(n.endsWith('.csv')||n.endsWith('.txt'))return parseCSV(await file.text());
 if(n.endsWith('.xlsx'))return parseXLSX(await file.arrayBuffer());
 throw new Error(t('impBadFile'))}

/* تحويل التواريخ: رقم إكسل التسلسلي، أو نص بأي صيغة شائعة */
function toDate(v){
 if(v===''||v==null)return null;
 const s=String(v).trim();if(!s)return null;
 if(/^\d+(\.\d+)?$/.test(s)){const n=+s;
  if(n>20000&&n<80000)return iso(new Date(Date.UTC(1899,11,30)+Math.round(n)*864e5))}
 let m=s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
 if(m)return m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
 m=s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);
 if(m)return m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
 const d=new Date(s);return isNaN(d)?null:iso(d)}
const toNum=v=>{const n=parseFloat(String(v??'').replace(/[^\d.\-]/g,''));return isNaN(n)?null:n};
const digits=v=>String(v??'').replace(/[^\d]/g,'');

function mapHeaders(headerRow,MAP){
 const idx={},used={};
 headerRow.forEach((h,i)=>{const k=nrm(h);if(!k)return;
  for(const field in MAP){if(used[field])continue;
   if(MAP[field].includes(k)){idx[field]=i;used[field]=1;return}}});
 return idx}

async function doImport(){
 if(!IMP.rows)return false;
 const {kind,rows,idx}=IMP;
 const cell=(r,f)=>idx[f]===undefined?'':String(r[idx[f]]??'').trim();
 let added=0,updated=0,skipped=0;
 const out=$('#impOut');
 out.innerHTML=`<p class="note">${t('impWorking')}</p>`;

 /* إنشاء الأقسام والمناصب الناقصة مرة واحدة */
 const ensure=async(table,list,name)=>{
  const v=name.trim();if(!v)return null;
  const hit=list.find(x=>nrm(x.name)===nrm(v));
  if(hit)return hit.id;
  const rowsNew=await api.ins(table,{name:v});
  const row=rowsNew&&rowsNew[0];if(row)list.push(row);
  return row?row.id:null};

 if(kind==='emp'){
  const deps=[...S.departments],poss=[...S.positions];
  const toAdd=[];
  for(const r of rows){
   const name=cell(r,'name');if(!name){skipped++;continue}
   const nid=digits(cell(r,'national_id'));
   const rec={name,
    national_id:nid||null,
    department_id:await ensure('departments',deps,cell(r,'department')),
    position_id:await ensure('positions',poss,cell(r,'position')),
    nationality:cell(r,'nationality')||null,
    phone:cell(r,'phone')||null,
    iban:cell(r,'iban')||null,
    iqama_expiry:toDate(cell(r,'iqama_expiry')),
    passport_expiry:toDate(cell(r,'passport_expiry'))};
   const ex=nid?S.emp.find(e=>digits(e.nid)===nid):null;
   if(ex){await api.upd('employees',ex.id,rec);updated++}
   else toAdd.push(rec)}
  if(toAdd.length){await api.ins('employees',toAdd);added=toAdd.length}
 }else{
  const toAdd=[];
  for(const r of rows){
   const plate=cell(r,'plate');if(!plate){skipped++;continue}
   const dn=cell(r,'driver');
   const drv=dn?S.emp.find(e=>nrm(e.name)===nrm(dn)||digits(e.nid)===digits(dn)):null;
   const st=cell(r,'status');
   const rec={plate,
    model:cell(r,'model')||plate,
    type:cell(r,'type')||null,
    year:toNum(cell(r,'year')),
    driver_id:drv?drv.id:null,
    km:toNum(cell(r,'km'))||0,
    istimara_expiry:toDate(cell(r,'istimara_expiry')),
    insurance_expiry:toDate(cell(r,'insurance_expiry')),
    status:VSTAT.includes(st)?st:'نشطة'};
   const ex=S.veh.find(v=>nrm(v.plate)===nrm(plate));
   if(ex){await api.upd('vehicles',ex.id,rec);updated++}
   else toAdd.push(rec)}
  if(toAdd.length){await api.ins('vehicles',toAdd);added=toAdd.length}
 }
 toast(`${t('impDone')} — ${t('impAdded')} ${added} · ${t('impUpdated')} ${updated}${skipped?' · '+t('impSkipped')+' '+skipped:''}`);
 IMP={kind:null,rows:null,idx:null};
}

 const u=l[0].unit,same=l.every(a=>a.unit===u);
 return{qty:same?l.reduce((n,a)=>n+(+a.qty||0),0):(+l[0].qty||0),unit:u,
        ids:l.map(a=>a.id),mixed:!same,note:(l.find(a=>a.note)||{}).note||'',
        now:adjTxt(sumAdj(l,l[0].kind))}}

  noop:()=>{},
  goMonthly:()=>go('monthly'),
  saveSheet:async()=>{
   if(!can('team'))return toast(t('noPermission'));
   const m=MS.month,day=monthEnd(m);
   const ex=(S.adj||[]).filter(a=>String(a.date||'').startsWith(m));
   const val=k=>{const el=$('#'+k);return el?el.value:''};
   const put=[],drop=[];
   for(const e of S.emp){
    for(const[kind,sfx]of[['إضافي','ot'],['خصم','dd']]){
     const note=(val('ms_'+e.id+'_'+sfx+'n')||'').trim()||null;
     const raw=val('ms_'+e.id+'_'+sfx).trim();
     const q=raw===''?0:Math.round((+raw||0)*100)/100;
     const u=val('ms_'+e.id+'_'+sfx+'u')||'ساعة';
     const o=cellOf(ex,e.id,kind);
     if(!(q>0)){if(o)drop.push(...o.ids);continue}
     if(!o){put.push({employee_id:e.id,kind,unit:u,qty:q,date:day,note});continue}
     if(o.mixed||o.qty!==q||o.unit!==u||(o.note||null)!==note){
      drop.push(...o.ids);put.push({employee_id:e.id,kind,unit:u,qty:q,date:day,note})}}}
   if(!put.length&&!drop.length)return toast(t('noChanges'));
   busy(true);
   try{
    for(const rid of drop)await api.del('time_adjustments',rid);
    if(put.length)await api.ins('time_adjustments',put);
    await refreshAll();toast(t('savedMonth'))}
   catch(ex2){toast(ex2.message)}finally{busy(false)}},
  addAdj:()=>{if(!can('team'))return toast(t('noPermission'));

/* ═══════════════ الإقلاع ═══════════════ */
const ADMIN_HATCH=location.hash==='#admin';
const TECH_MODE=ADMIN_HATCH||location.hash==='#setup';
applyLang();

async function boot(){
 if(!CFG||!CFG.url||!CFG.key)return setupScreen();
 if(location.hash==='#setup'&&!SESSION)return setupScreen();
 if(location.hash==='#first'&&!SESSION)return firstRunScreen();
 if(SESSION&&SESSION.access_token)return start();
 if(ADMIN_HATCH)return emailLoginScreen();
 if(CFG.auto){
  busy(true);
  try{await doLogin(idEmail(CFG.auto),idPass(CFG.auto));return}
  catch(ex){return loginScreen(loginErrText(ex.message))}
  finally{busy(false)}}
 loginScreen()}
boot();

window.addEventListener('hashchange',()=>{
 if(me||!CFG||!CFG.url||!CFG.key)return;
 if(location.hash==='#admin')emailLoginScreen();
 else if(location.hash==='#setup')setupScreen();
 else if(location.hash==='#first')firstRunScreen()});

if('serviceWorker'in navigator)window.addEventListener('load',()=>{
 navigator.serviceWorker.register('sw.js').catch(()=>{})});
</script>
